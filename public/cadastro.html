<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Escalas</title>
    <link rel="icon" href="/shop_icone.webp" type="image/webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <script>
        if (localStorage.getItem('tema') === 'dark' || localStorage.getItem('theme') === 'dark' || (!('tema' in localStorage) && !('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 antialiased flex justify-center items-center min-h-screen p-6">
    <div class="bg-white dark:bg-zinc-800/50 rounded-2xl ring-1 ring-zinc-900/5 dark:ring-white/10 p-8 w-full max-w-md shadow-lg shadow-zinc-900/5 dark:shadow-none">
        <div class="text-center mb-6">
            <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-user-plus text-white text-sm"></i>
            </div>
            <h2 class="text-lg font-semibold text-zinc-900 dark:text-white">Cadastrar Novo Usuário</h2>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">Preencha os dados do novo membro da equipe.</p>
        </div>
        <form id="formCadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Nome Completo</label>
                <input type="text" id="nome" required class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm shadow-zinc-900/5 dark:shadow-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">E-mail (Google)</label>
                <input type="email" id="email" required placeholder="exemplo@alterdata.com.br" class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition placeholder:text-zinc-400 dark:placeholder:text-zinc-500 shadow-sm shadow-zinc-900/5 dark:shadow-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Perfil</label>
                    <select id="tipo_perfil" class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm shadow-zinc-900/5 dark:shadow-none">
                        <option value="ANALISTA">Analista</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Setor</label>
                    <select id="setor_id" class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm shadow-zinc-900/5 dark:shadow-none">
                        <option value="1">Retaguarda</option>
                        <option value="2">Segundo nível</option>
                        <option value="3">SPED/Muven</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Saída Almoço</label>
                    <input type="time" id="almoco_saida" required class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm shadow-zinc-900/5 dark:shadow-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Retorno Almoço</label>
                    <input type="time" id="almoco_retorno" required class="block w-full rounded-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm shadow-zinc-900/5 dark:shadow-none">
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors shadow-sm text-sm mt-2">
                Salvar Usuário
            </button>
        </form>
        <div id="mensagem" class="mt-4 text-center hidden font-medium text-sm"></div>
    </div>
    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();
            const dadosUsuario = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                tipo_perfil: document.getElementById('tipo_perfil').value,
                setor_id: document.getElementById('setor_id').value,
                almoco_saida: document.getElementById('almoco_saida').value,
                almoco_retorno: document.getElementById('almoco_retorno').value
            };
            try {
                const resposta = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosUsuario)
                });
                const divMensagem = document.getElementById('mensagem');
                divMensagem.classList.remove('hidden');
                if (resposta.ok) {
                    divMensagem.textContent = 'Usuário cadastrado com sucesso!';
                    divMensagem.className = 'mt-4 text-center text-emerald-600 font-medium text-sm';
                    document.getElementById('formCadastro').reset();
                } else {
                    const erro = await resposta.json();
                    divMensagem.textContent = erro.erro || 'Erro ao cadastrar.';
                    divMensagem.className = 'mt-4 text-center text-red-500 font-medium text-sm';
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro ao conectar com o servidor.");
            }
        });
    </script>
    <script src="/js/security.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/configuracoes.js"></script>
    <script src="/js/app.js?v=3"></script>
</body>
</html>
