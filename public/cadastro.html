<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Analistas</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
</head>
<body class="bg-gray-100 p-6 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Cadastrar Novo Usuário</h2>
        
        <form id="formCadastro" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail (Google)</label>
                <input type="email" id="email" required placeholder="exemplo@alterdata.com.br" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Perfil</label>
                    <select id="tipo_perfil" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        <option value="ANALISTA">Analista</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Setor</label>
                    <select id="setor_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        <option value="1">Retaguarda</option>
                        <option value="2">Segundo nível</option>
                        <option value="3">SPED/Muven</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Saída Almoço</label>
                    <input type="time" id="almoco_saida" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Retorno Almoço</label>
                    <input type="time" id="almoco_retorno" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition mt-4">
                Salvar Usuário
            </button>
        </form>

        <div id="mensagem" class="mt-4 text-center hidden font-medium"></div>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const dadosUsuario = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                tipo_perfil: document.getElementById('tipo_perfil').value,
                setor_id: document.getElementById('setor_id').value,
                almoco_saida: document.getElementById('almoco_saida').value,
                almoco_retorno: document.getElementById('almoco_retorno').value
            };

            try {
                // Enviando os dados para o nosso backend Node.js
                const resposta = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dadosUsuario)
                });

                const divMensagem = document.getElementById('mensagem');
                divMensagem.classList.remove('hidden');

                if (resposta.ok) {
                    divMensagem.textContent = 'Usuário cadastrado com sucesso!';
                    divMensagem.className = 'mt-4 text-center text-green-600 font-medium';
                    document.getElementById('formCadastro').reset(); // Limpa o formulário
                } else {
                    const erro = await resposta.json();
                    divMensagem.textContent = erro.erro || 'Erro ao cadastrar.';
                    divMensagem.className = 'mt-4 text-center text-red-600 font-medium';
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro ao conectar com o servidor. O Node.js está rodando?");
            }
        });
    </script>
    <script src="/js/security.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/configuracoes.js"></script>
    <script src="/js/app.js"></script>
</body>
</body>
</html>
