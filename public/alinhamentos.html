<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos - Escalas</title>
    <link rel="icon" href="/shop_icone.webp" type="image/webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <script>
        if (localStorage.getItem('tema') === 'dark' || localStorage.getItem('theme') === 'dark' || (!('tema' in localStorage) && !('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 antialiased">
    <div id="header-container"></div>

    <div id="main-wrapper" class="lg:pl-64 transition-all duration-300 flex flex-col min-h-screen">
        <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
            <div class="mb-8 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-semibold text-zinc-900 dark:text-white tracking-tight">Alinhamentos (Retaguarda)</h1>
                    <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Atendimentos abertos indevidamente que necessitam alinhamento do supervisor.</p>
                </div>
                <button onclick="abrirModalNovoAlinhamento()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-lg shadow-sm font-semibold text-sm transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> Registrar Ocorrência
                </button>
            </div>

            <div class="bg-white dark:bg-zinc-800/50 rounded-2xl ring-1 ring-zinc-900/5 dark:ring-white/10 overflow-hidden shadow-sm shadow-zinc-900/5 dark:shadow-none">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-zinc-100 dark:border-zinc-800 text-[11px] uppercase tracking-widest text-zinc-400 dark:text-zinc-500">
                                <th class="p-4 font-semibold">Aberto por</th>
                                <th class="p-4 font-semibold">Nº Atendimento</th>
                                <th class="p-4 font-semibold">Ocorrência</th>
                                <th class="p-4 font-semibold">Data</th>
                                <th class="p-4 font-semibold text-center">Status</th>
                                <th class="p-4 font-semibold text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-alinhamentos" class="divide-y divide-zinc-100 dark:divide-zinc-800 text-sm">
                            <tr>
                                <td colspan="6" class="p-6 text-center text-zinc-500">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        
        <div class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-auto">
            <div id="footer-container"></div>
        </div>
    </div>

    <div id="modais-container"></div>

    <script src="/js/security.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/app.js?v=3"></script>
    <script src="/js/alinhamentos.js"></script>
</body>
</html>
