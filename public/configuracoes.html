<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Escalas</title>
    <link rel="icon" href="/shop_icone.webp" type="image/webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>

    <script>
        if (localStorage.getItem('tema') === 'dark' || localStorage.getItem('theme') === 'dark' || (!('tema' in localStorage) && !('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 antialiased">

    <div id="header-container"></div>

    <div id="main-wrapper" class="lg:pl-64 transition-all duration-300 flex flex-col min-h-screen">
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 mt-12 lg:mt-0">
            
            <div class="mb-8">
                <h1 class="text-2xl font-semibold text-zinc-900 dark:text-white flex items-center gap-2 tracking-tight">
                    Configurações
                </h1>
                <p class="text-zinc-500 dark:text-zinc-400 text-sm mt-1">Gerencie a equipe, setores e categorias do sistema.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <button onclick="abrirListagemUsuarios()" class="group flex flex-col items-center justify-center p-8 bg-white hover:bg-zinc-50 ring-1 ring-zinc-900/5 hover:ring-emerald-500/30 dark:bg-zinc-800/50 dark:ring-white/10 dark:hover:bg-zinc-800 dark:hover:ring-emerald-500/30 rounded-2xl transition-all shadow-sm shadow-zinc-900/5 dark:shadow-none hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-users text-2xl"></i>
                    </div>
                    <span class="font-semibold text-lg text-zinc-900 dark:text-zinc-100">Equipe</span>
                    <span class="text-sm text-zinc-500 dark:text-zinc-400 mt-2 text-center">Gerenciar contas e usuários</span>
                </button>

                <button onclick="abrirModalSetores()" class="group flex flex-col items-center justify-center p-8 bg-white hover:bg-zinc-50 ring-1 ring-zinc-900/5 hover:ring-emerald-500/30 dark:bg-zinc-800/50 dark:ring-white/10 dark:hover:bg-zinc-800 dark:hover:ring-emerald-500/30 rounded-2xl transition-all shadow-sm shadow-zinc-900/5 dark:shadow-none hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-building-user text-2xl"></i>
                    </div>
                    <span class="font-semibold text-lg text-zinc-900 dark:text-zinc-100">Setores</span>
                    <span class="text-sm text-zinc-500 dark:text-zinc-400 mt-2 text-center">Estrutura e departamentos</span>
                </button>

                <button onclick="abrirModalTipos()" class="group flex flex-col items-center justify-center p-8 bg-white hover:bg-zinc-50 ring-1 ring-zinc-900/5 hover:ring-emerald-500/30 dark:bg-zinc-800/50 dark:ring-white/10 dark:hover:bg-zinc-800 dark:hover:ring-emerald-500/30 rounded-2xl transition-all shadow-sm shadow-zinc-900/5 dark:shadow-none hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-tags text-2xl"></i>
                    </div>
                    <span class="font-semibold text-lg text-zinc-900 dark:text-zinc-100">Categorias</span>
                    <span class="text-sm text-zinc-500 dark:text-zinc-400 mt-2 text-center">Tipos de atendimento</span>
                </button>

                <button onclick="abrirModalWebhookGeral()" class="group flex flex-col items-center justify-center p-8 bg-white hover:bg-zinc-50 ring-1 ring-zinc-900/5 hover:ring-emerald-500/30 dark:bg-zinc-800/50 dark:ring-white/10 dark:hover:bg-zinc-800 dark:hover:ring-emerald-500/30 rounded-2xl transition-all shadow-sm shadow-zinc-900/5 dark:shadow-none hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-satellite-dish text-2xl"></i>
                    </div>
                    <span class="font-semibold text-lg text-zinc-900 dark:text-zinc-100">Webhook Geral</span>
                    <span class="text-sm text-zinc-500 dark:text-zinc-400 mt-2 text-center">Monitoramento de todos os avisos</span>
                </button>

                <button onclick="abrirModalBimerConfig()" class="group flex flex-col items-center justify-center p-8 bg-white hover:bg-zinc-50 ring-1 ring-zinc-900/5 hover:ring-emerald-500/30 dark:bg-zinc-800/50 dark:ring-white/10 dark:hover:bg-zinc-800 dark:hover:ring-emerald-500/30 rounded-2xl transition-all shadow-sm shadow-zinc-900/5 dark:shadow-none hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-rocket text-2xl"></i>
                    </div>
                    <span class="font-semibold text-lg text-zinc-900 dark:text-zinc-100">API Bimer</span>
                    <span class="text-sm text-zinc-500 dark:text-zinc-400 mt-2 text-center">Credenciais do lançamento de horas</span>
                </button>
            </div>

        </main>

        <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-auto">
            <div id="footer-container"></div>
        </div>
    </div>

    <div id="modais-container"></div>

    <script src="/js/security.js"></script>
    <script src="/js/app.js?v=3"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/configuracoes.js"></script>
</body>
</html>
