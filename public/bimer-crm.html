<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão CRM - Escalas</title>
    <link rel="icon" href="/shop_icone.webp" type="image/webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <script>
        if (localStorage.getItem('tema') === 'dark' || (!('tema' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="font-sans bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">
    <div id="header-container"></div>
    <div id="main-wrapper" class="lg:pl-64 transition-all duration-300 flex flex-col min-h-screen">
        <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                    <h1 class="text-2xl font-semibold text-zinc-900 dark:text-white tracking-tight">Gestão CRM</h1>
                    <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Atendimentos em aberto sincronizados do Alterdata Bimer.</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="sincronizarBimer()" class="text-zinc-700 dark:text-zinc-300 ring-1 ring-inset ring-zinc-900/10 dark:ring-white/10 hover:bg-zinc-50 dark:hover:bg-zinc-800 bg-white dark:bg-zinc-800/50 px-4 py-2.5 rounded-lg shadow-sm transition-colors font-medium text-sm flex items-center gap-2">
                        <i class="fa-solid fa-rotate"></i> Sincronizar
                    </button>
                    <button onclick="enviarWebhooksManualmente()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-lg shadow-sm transition-colors font-semibold text-sm flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Notificar
                    </button>
                </div>
            </div>

            <div class="bg-white dark:bg-zinc-900 rounded-2xl ring-1 ring-zinc-900/5 dark:ring-white/10 p-5 mb-6 shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[11px] font-medium text-zinc-500 dark:text-zinc-400 mb-1.5 uppercase tracking-widest">Pesquisar Pessoa</label>
                        <input type="text" id="filtro-pesquisa-crm" placeholder="Digite o nome..." class="w-full rounded-lg bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white px-3 py-2.5 text-sm ring-1 ring-zinc-900/10 dark:ring-white/10 focus:ring-2 focus:ring-emerald-500 outline-none transition" onkeyup="renderizarBimerCRM()">
                    </div>
                    <div class="flex items-end">
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-zinc-600 dark:text-zinc-300 p-2.5">
                            <input type="checkbox" id="filtro-atraso-crm" class="rounded border-zinc-300 text-emerald-500 focus:ring-emerald-500 bg-zinc-50 dark:bg-zinc-800" onchange="renderizarBimerCRM()">
                            Atrasados + Hoje
                        </label>
                    </div>
                    <div class="flex items-end justify-end gap-3 pb-2.5">
                        <button onclick="toggleTodosGrupos(true)" class="text-sm font-medium text-emerald-600 dark:text-emerald-400 hover:underline">Expandir</button>
                        <span class="text-zinc-300 dark:text-zinc-700">|</span>
                        <button onclick="toggleTodosGrupos(false)" class="text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:underline">Recolher</button>
                    </div>
                </div>
            </div>

            <div id="container-grupos-crm" class="space-y-4">
                <!-- Grupos serão inseridos aqui -->
            </div>
        </main>
        <div class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-auto">
            <div id="footer-container"></div>
        </div>
    </div>
    
    <script src="/js/security.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/app.js?v=3"></script>
    <script src="/js/crm.js"></script>
</body>
</html>
